<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #1E232A; stroke: #4A90E2; stroke-width: 2; rx: 8; ry: 8; }
      .box-s3 { fill: #1B2B1B; stroke: #569A31; stroke-width: 2; rx: 8; ry: 8; }
      .box-user { fill: #2B1E2B; stroke: #BD10E0; stroke-width: 2; rx: 8; ry: 8; }
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #FFFFFF; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #AAAAAA; }
      .code { font-family: monospace; font-size: 12px; fill: #50E3C2; }
      .arrow { stroke: #F5A623; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F5A623" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#12151A" />

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" class="title" font-size="20">Air Quality Forecasting Pipeline on AWS</text>
  <text x="475" y="55" text-anchor="middle" class="subtitle">End-to-End Cloud Data Engineering &amp; ML Architecture</text>

  <!-- External API Box -->
  <rect x="330" y="80" width="290" height="70" class="box" stroke="#F5A623" />
  <text x="475" y="105" text-anchor="middle" class="title">Open-Meteo REST APIs</text>
  <text x="475" y="125" text-anchor="middle" class="subtitle">Air Quality (CAMS) + Weather (Forecast &amp; Archive)</text>
  <text x="475" y="140" text-anchor="middle" class="code">Hourly Pollutants + Weather Forecasts</text>

  <!-- Arrow down to EC2 -->
  <line x1="475" y1="150" x2="475" y2="190" class="arrow" />
  <text x="485" y="175" class="subtitle" fill="#F5A623">HTTPS Daily</text>

  <!-- EC2 Box -->
  <rect x="70" y="200" width="460" height="310" class="box" />
  <text x="300" y="225" text-anchor="middle" class="title">AWS EC2 Ubuntu 22.04 LTS (t3.small)</text>
  <text x="300" y="245" text-anchor="middle" class="subtitle">Scheduled Automated Pipeline &amp; Web Hosting</text>

  <rect x="90" y="260" width="420" height="180" fill="#15191E" rx="6" />
  <text x="110" y="285" class="code">1. collect.py   → Ingestion with Exponential Backoff</text>
  <text x="110" y="310" class="code">2. clean.py     → Deduplication &amp; Daily Parquet</text>
  <text x="110" y="335" class="code">3. validate.py  → Automated Data Quality Checks</text>
  <text x="110" y="360" class="code">4. features.py  → Lag, Rolling &amp; Seasonal Feature Eng</text>
  <text x="110" y="385" class="code">5. train.py     → Time-Series CV &amp; Champion Selection</text>
  <text x="110" y="410" class="code">6. predict.py   → 7-Day Multi-Horizon Forecaster</text>
  <text x="110" y="430" class="code">7. evaluate.py  → Forecast vs Actual &amp; PSI Drift</text>

  <rect x="90" y="455" width="420" height="40" fill="#262730" rx="6" />
  <text x="300" y="480" text-anchor="middle" class="title" fill="#FF4B4B">Streamlit Web Dashboard (Port 8501 via Systemd)</text>

  <!-- Arrow from EC2 to S3 -->
  <line x1="530" y1="350" x2="610" y2="350" class="arrow" />
  <text x="570" y="340" text-anchor="middle" class="subtitle">boto3 (IAM Role)</text>

  <!-- S3 Box -->
  <rect x="620" y="200" width="260" height="200" class="box-s3" />
  <text x="750" y="225" text-anchor="middle" class="title" fill="#7ED321">AWS S3 Data Lake</text>
  <text x="750" y="245" text-anchor="middle" class="subtitle">Encrypted &amp; Partitioned Object Store</text>

  <text x="640" y="275" class="code">📁 raw/ (JSON daily partitions)</text>
  <text x="640" y="300" class="code">📁 processed/ (daily_dataset.parquet)</text>
  <text x="640" y="325" class="code">📁 models/ (champion artifacts)</text>
  <text x="640" y="350" class="code">📁 predictions/ (7-day forecasts)</text>
  <text x="640" y="375" class="code">📁 metrics/ (leaderboard, drift, status)</text>

  <!-- Arrow from Streamlit to End Users -->
  <line x1="300" y1="510" x2="300" y2="530" class="arrow" />
  <rect x="620" y="430" width="260" height="80" class="box-user" />
  <text x="750" y="460" text-anchor="middle" class="title">Public Web Browser</text>
  <text x="750" y="485" text-anchor="middle" class="subtitle">http://&lt;EC2-Public-IP&gt;:8501</text>
  <path d="M 510 475 L 610 475" stroke="#BD10E0" stroke-width="2" marker-end="url(#arrowhead)" />
</svg>
